name: Publish to npm

"on":
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publication waits for the npm environment protection rules configured in
    # repository settings. Keep required reviewers there, not in this workflow.
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      # Only publish commits that belong to main. A depth-limited fetch would
      # create a shallow boundary and make merge-base report a false negative
      # when main advanced after the tag, so fetch the full main history.
      - name: Verify release commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: npm ci

      - name: Verify source, tests, and build
        run: npm run preflight

      - name: Verify release metadata
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Verify npm package
        run: npm run pack:check

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          # Needed only to bootstrap the first publication. Remove the secret
          # after configuring npm Trusted Publishing for this workflow.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
